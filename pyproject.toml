# Notes:
# 1. Primary dependencies are consolidated in pyproject.toml.
# 2. The runtime environment is pinned via uv.lock to prevent resolving different version combinations across machines.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mpt"
version = "1.3.9"
description = "Official MoneyPrinterTurbo package with WebUI and CLI, maintained by harry0703."
readme = "docs/pypi-description.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    # Streamlit 1.59.1 gzip adaptation relies on legacy response protocol; newer versions cause media response errors.
    "starlette==1.2.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.3.1",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    # Consistent with requirements.txt: PyAV 19 removed parameters used by Whisper.
    "av<19",
    "toml==0.10.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.scripts]
mpt = "app.launcher:main"

[project.urls]
Homepage = "https://github.com/harry0703/MoneyPrinterTurbo"
Issues = "https://github.com/harry0703/MoneyPrinterTurbo/issues"

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI must prepend the project root to sys.path before importing the app package.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Branch coverage helps identify cases where a line executed, but the alternative branch was never verified.
# It is better suited as a CI quality baseline than line coverage alone. Both CLI and WebUI are production
# entrypoints, so they are tracked along with the app service layer, service launchers, and agent skill scripts.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Full test suites on Python 3.11 and 3.13 both exceed 70.4% branch coverage. Using 70% as a baseline
# solidifies failure states, async publication recovery, and Redis atomic update tests, while leaving headroom
# for minor branch differences across Python versions and OS platforms.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app", "webui"]

# Fonts retain Chinese/English default fonts and Vietnamese fonts. The two large fallback font weights are omitted
# from the package to avoid exceeding PyPI default file size limits; source font files remain intact.
[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "app/cli.py"
"config.example.toml" = "app/_assets/config.example.toml"
"resource/fonts/STHeitiMedium.ttc" = "app/_assets/resource/fonts/STHeitiMedium.ttc"
"resource/fonts/MicrosoftYaHeiBold.ttc" = "app/_assets/resource/fonts/MicrosoftYaHeiBold.ttc"
"resource/fonts/BeVietnamPro-Bold.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Bold.ttf"
"resource/fonts/BeVietnamPro-Medium.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Medium.ttf"
"resource/fonts/Charm-Bold.ttf" = "app/_assets/resource/fonts/Charm-Bold.ttf"
"resource/fonts/Charm-Regular.ttf" = "app/_assets/resource/fonts/Charm-Regular.ttf"
"resource/fonts/UTM Kabel KT.ttf" = "app/_assets/resource/fonts/UTM Kabel KT.ttf"
"resource/fonts/DevanagariMT.ttc" = "app/_assets/resource/fonts/DevanagariMT.ttc"
"resource/songs" = "app/_assets/resource/songs"
"resource/public" = "app/_assets/resource/public"

[tool.hatch.build]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc", "**/.streamlit"]

[tool.hatch.build.targets.sdist]
# Whitelist files to prevent local configurations, credentials, storage, and agent notes from leaking into source dists.
include = [
    "/app", "/cli.py", "/webui", "/config.example.toml", "/pyproject.toml",
    "/uv.lock", "/LICENSE", "/docs/pypi-description.md", "/docs/packaging.md",
    "/test/services/test_packaging.py", "/resource/songs", "/resource/public",
    "/resource/fonts/STHeitiMedium.ttc", "/resource/fonts/MicrosoftYaHeiBold.ttc",
    "/resource/fonts/BeVietnamPro-Bold.ttf", "/resource/fonts/BeVietnamPro-Medium.ttf",
    "/resource/fonts/Charm-Bold.ttf", "/resource/fonts/Charm-Regular.ttf",
    "/resource/fonts/UTM Kabel KT.ttf", "/resource/fonts/DevanagariMT.ttc",
]

[tool.uv]
package = true
